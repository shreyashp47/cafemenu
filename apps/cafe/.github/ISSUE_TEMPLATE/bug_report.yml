name: Bug report
description: Something on the customer, staff or owner screens is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /order?table=3
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site (toe-cafe.web.app)
        - Local, demo mode
        - Local, against Firebase
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Screen
      multiple: true
      options:
        - Table picker (home page)
        - Customer menu / cart
        - Order confirmation
        - Staff board
        - Owner menu
        - Owner reports
        - QR cards
        - Other
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android 15, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
