name: Deploy

# Every push to main that passes CI goes live. This runs after the CI workflow
# rather than repeating its checks, so nothing reaches customers that the full
# pipeline (tests, rules attack, self-check, phone-width audit) has not passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploy by hand, e.g. after rotating a key. Still builds the current main.
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a hosting release that is
# interrupted after the rules went out is exactly the old-client/new-rules gap
# the v0.2.0 upgrade notes warn about. A newer push waits its turn instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: rules + hosting → toi-cafe
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://toe-cafe.web.app

    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Public by design: they identify the project and end up in every page's
      # JavaScript anyway. Kept as repository variables, not secrets, so they
      # are visible and not masked in logs. firestore.rules protects the data.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_CAFE_NAME: ${{ vars.NEXT_PUBLIC_CAFE_NAME }}
      NEXT_PUBLIC_TABLES: ${{ vars.NEXT_PUBLIC_TABLES }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # CI runs can finish out of order. If main has moved on since this commit,
      # the run for the newer commit will deploy it; deploying this one now would
      # briefly roll the site back.
      - name: Skip if main has moved on
        id: current
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$SHA" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::notice::$SHA is no longer the tip of main; its successor will deploy"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Without these the build silently falls back to demo mode, and the live
      # site would start storing orders in each visitor's own browser.
      - name: Check the Firebase config is set
        if: steps.current.outputs.stale != 'true'
        run: |
          missing=0
          # All six Firebase values: src/lib/config.ts falls back to demo mode if
          # any one is missing, which is exactly what this step exists to stop.
          for v in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
                   NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
                   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID \
                   NEXT_PUBLIC_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::repository variable $v is not set"; missing=1; fi
          done
          if [ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" != "toi-cafe" ]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_PROJECT_ID is '$NEXT_PUBLIC_FIREBASE_PROJECT_ID', expected toi-cafe"
            missing=1
          fi
          exit $missing

      - uses: actions/setup-node@v7
        if: steps.current.outputs.stale != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.current.outputs.stale != 'true'
        run: npm ci

      # Same retry as CI: next/font fetches from Google at build time.
      - name: Build
        if: steps.current.outputs.stale != 'true'
        run: |
          npm run build || {
            echo "::warning::build failed, retrying once (next/font fetch is network-dependent)"
            sleep 20
            npm run build
          }

      - name: Check the build points at the live project
        if: steps.current.outputs.stale != 'true'
        run: |
          grep -rlq "toi-cafe" out/_next/static/chunks \
            || { echo "::error::built bundle does not reference toi-cafe"; exit 1; }

      - uses: google-github-actions/auth@v2
        if: steps.current.outputs.stale != 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Rules and hosting in one command, so the window where the two disagree
      # is as short as the CLI can make it.
      - name: Deploy
        if: steps.current.outputs.stale != 'true'
        env:
          TITLE: ${{ github.event.workflow_run.display_title || 'manual deploy' }}
        run: |
          npx --yes firebase-tools@15.31.0 deploy \
            --only firestore:rules,hosting \
            --project toi-cafe \
            --non-interactive \
            --message "${SHA::7} ${TITLE:0:80}"

      # Proves the new build is what the CDN serves: the service worker carries a
      # hash of this build, and /sw.js is served with no-cache.
      - name: Check the live site serves this build
        if: steps.current.outputs.stale != 'true'
        run: |
          want=$(grep -o 'const VERSION = "[^"]*"' out/sw.js)
          for _ in $(seq 1 20); do
            got=$(curl -sf https://toe-cafe.web.app/sw.js | grep -o 'const VERSION = "[^"]*"' || true)
            if [ "$got" = "$want" ]; then
              echo "live: $got"
              for path in / /order /order?table=1 /staff /admin; do
                code=$(curl -s -o /dev/null -w '%{http_code}' "https://toe-cafe.web.app$path")
                echo "$path → $code"
                [ "$code" = 200 ] || [ "$code" = 301 ] || [ "$code" = 302 ] || exit 1
              done
              exit 0
            fi
            sleep 6
          done
          echo "::error::live sw.js is '$got', expected '$want'"
          exit 1
