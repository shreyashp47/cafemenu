name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one run per branch; a new push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The cafe app (TOE, generalised) lives in apps/cafe, and the code it shares
# with the rest of CafeMenu in packages/shared. Dependencies install once at the
# repository root, because this is an npm workspace; everything else runs
# inside the app's folder unless a step says otherwise.
defaults:
  run:
    working-directory: apps/cafe

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      # The cafe settings type and its validator, which the cafe app, the
      # console and the deployer all build on.
      - name: Shared package (typecheck · test · format)
        working-directory: packages/shared
        run: npm run verify

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The same suite as TOE Cafe, the first cafe on the platform (issue #18):
      # every page runs with TOE's settings instead of the demo cafe's.
      - name: Test as TOE Cafe (fixtures/toe.json)
        run: npm test
        env:
          CAFE_FIXTURE: toe

      - name: Build
        run: npm run build

  # Proves the "professional" claim rather than asserting it: deliberately break
  # a money rule and confirm the suite catches it.
  self-check:
    name: tests actually fail on a broken rule
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      - name: Introduce a deliberate bug
        run: |
          sed -i 's/return lines.reduce((sum, line) => sum + lineSubtotal(line), 0);/return lines.reduce((sum, line) => sum + line.qty, 0);/' src/lib/money.ts
          git diff --stat

      - name: The suite must go red
        run: |
          if npm test -- --run src/lib/__tests__/money.test.ts; then
            echo "::error::money tests passed against a broken implementation"
            exit 1
          fi
          echo "money tests correctly failed"

  visual:
    name: mobile layout smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # A production build, not `next dev`: every route is prerendered, so the
      # 24 screenshots take seconds instead of recompiling the app 8 times.
      # `next/font/google` fetches the font files from Google at build time, so a
      # flaky network on the runner fails the build with an unhelpful
      # "Cannot read properties of null" from the font loader. Retry once: the
      # failure is transient, and the alternative is self-hosting the woff2
      # files (documented as the fallback in the README).
      - name: Build
        run: |
          npm run build || {
            echo "::warning::build failed, retrying once (next/font fetch is network-dependent)"
            sleep 20
            npm run build
          }

      # `next start` refuses to run under `output: "export"`, so the export in
      # ./out is served instead — which is also closer to what Firebase Hosting
      # actually serves, since that is a static host too.
      - name: Start the server
        run: |
          npx --yes serve@latest out --listen 4320 --no-clipboard &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4320/; then
              echo "server up"
              exit 0
            fi
            sleep 2
          done
          echo "server never came up"
          exit 1

      - name: Check every screen at phone widths
        run: node scripts/screenshot.mjs --quick
        env:
          BASE_URL: http://127.0.0.1:4320

      # WebKit is Safari/iOS, and colour contrast is a real gate here: the theme
      # is a fixed warm palette, and two of its mid-tones cannot legally carry
      # body text. This is what catches that.
      # Every way a customer can arrive, including tapping a table number on the
      # picker. That path was broken for as long as it existed and nothing caught
      # it, because flow.mjs always navigated straight to /order?table=N.
      - name: Entry paths
        run: node scripts/entry.mjs
        env:
          BASE_URL: http://127.0.0.1:4320

      - name: Accessibility + WebKit audit
        run: node scripts/audit.mjs
        env:
          BASE_URL: http://127.0.0.1:4320

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: apps/cafe/.screenshots/
          retention-days: 14

  # TOE is live and becomes the first cafe on the platform, so every pull
  # request drives the real build as TOE Cafe in a browser (issue #18): its
  # settings from fixtures/toe.json, deployed as a preview (site.json with
  # "demo": true), so the demo store stands in for Firestore. Demo mode only,
  # and on purpose: flow.mjs places real orders, and nothing here may ever
  # reach toe-cafe.web.app.
  toe:
    name: TOE Cafe fixture (browser, demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Retried once, as in the visual job: next/font fetches from Google at
      # build time.
      - name: Build
        run: |
          npm run build || {
            echo "::warning::build failed, retrying once (next/font fetch is network-dependent)"
            sleep 20
            npm run build
          }

      - name: Deploy TOE's settings into the build, as a demo
        run: node scripts/use-fixture.mjs toe

      - name: Start the server
        run: |
          npx --yes serve@latest out --listen 4320 --no-clipboard &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4320/site.json; then
              echo "server up, serving TOE's site.json"
              exit 0
            fi
            sleep 2
          done
          echo "server never came up"
          exit 1

      - name: The pages are TOE's
        run: |
          curl -sf http://127.0.0.1:4320/site.json | grep -q '"name": "TOE Cafe"'
          curl -sf http://127.0.0.1:4320/site.json | grep -q '"demo": true'

      # First: it clears .screenshots/, where flow.mjs also saves its own.
      # For comparing by eye with TOE v0.3.0 in docs/screens/.
      - name: Every screen at phone widths
        run: node scripts/screenshot.mjs --quick
        env:
          BASE_URL: http://127.0.0.1:4320

      - name: Entry paths
        run: node scripts/entry.mjs
        env:
          BASE_URL: http://127.0.0.1:4320

      - name: Customer to staff to customer
        run: node scripts/flow.mjs
        env:
          BASE_URL: http://127.0.0.1:4320

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toe-fixture-screens
          path: apps/cafe/.screenshots/
          retention-days: 14

  # firestore.rules is not TypeScript, so nothing else in this pipeline can see a
  # mistake in it. It shipped once with a lambda in it — `reduce(0, function(){})`
  # — that the rules language has no support for, and the only thing that noticed
  # was `firebase deploy`, on the maintainer's machine, after a customer-facing
  # release was already planned. This job is the check that should have existed.
  rules:
    name: firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firestore and Auth emulators are Java programs, and current
      # firebase-tools refuses to run them on anything below 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        working-directory: .
        run: npm ci

      - name: Start the emulators
        run: |
          npx firebase-tools emulators:start --project demo-cafe \
            --only firestore,auth > /tmp/emulators.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8080/" \
              && curl -sf -o /dev/null "http://127.0.0.1:9099/"; then
              echo "emulators up"
              exit 0
            fi
            sleep 3
          done
          echo "emulators never came up"
          cat /tmp/emulators.log
          exit 1

      # As TOE Cafe: config/site is seeded with fixtures/toe.json (issue #18).
      - name: Attack the rules
        run: node scripts/rules-test.mjs
        env:
          CAFE_FIXTURE: toe

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: emulator-log
          path: /tmp/emulators.log
          retention-days: 7
